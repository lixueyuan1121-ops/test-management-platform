<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测试管理平台</title>
    <style>
      /* 内联首屏 loading：HTML 一加载就显示，Vue 挂载后自动替换，消除首屏白屏 */
      .init-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;
        background:linear-gradient(135deg,#1c2440,#243b6b,#3b2a6b,#1c2440);background-size:300% 300%;animation:ig 16s ease infinite;}
      .init-target{width:88px;height:88px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));}
      .init-sweep{transform-origin:60px 60px;animation:isw 3.2s linear infinite;}
      .init-check{stroke-dasharray:60;stroke-dashoffset:60;animation:ick 0.9s ease-out 0.5s forwards;}
      .init-text{color:#c8d4f5;font-size:14px;letter-spacing:3px;}
      .init-dots{display:inline-flex;gap:4px;margin-left:4px;}
      .init-dots i{width:5px;height:5px;border-radius:50%;background:#9db4ff;display:inline-block;animation:idp 1.2s ease-in-out infinite;}
      .init-dots i:nth-child(2){animation-delay:.2s}.init-dots i:nth-child(3){animation-delay:.4s}
      @keyframes isw{to{transform:rotate(360deg)}}
      @keyframes ick{to{stroke-dashoffset:0}}
      @keyframes ig{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
      @keyframes idp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
    </style>
    <script type="module" crossorigin src="/assets/index-s68DTjvw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DTCPNYRB.css">
  </head>
  <body>
    <div id="app">
      <div class="init-loader">
        <svg class="init-target" viewBox="0 0 120 120" width="88" height="88" aria-label="加载中">
          <!-- 工业取景框四角 -->
          <g stroke="#8ea3e0" stroke-width="2" fill="none" stroke-linecap="square">
            <path d="M10 26 L10 10 L26 10" />
            <path d="M94 10 L110 10 L110 26" />
            <path d="M110 94 L110 110 L94 110" />
            <path d="M26 110 L10 110 L10 94" />
          </g>
          <!-- 同心圆靶环 -->
          <circle cx="60" cy="60" r="40" fill="none" stroke="#c8d4f5" stroke-width="2" />
          <circle cx="60" cy="60" r="27" fill="none" stroke="#7f93cf" stroke-width="2" />
          <!-- 十字准星 -->
          <g stroke="#7f93cf" stroke-width="2" stroke-linecap="square">
            <path d="M60 8 L60 24" />
            <path d="M60 96 L60 112" />
            <path d="M8 60 L24 60" />
            <path d="M96 60 L112 60" />
          </g>
          <!-- 扫描环（旋转） -->
          <circle class="init-sweep" cx="60" cy="60" r="40" fill="none" stroke="#00e5a0"
                  stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 221" />
          <!-- 中心对勾 -->
          <path class="init-check" d="M46 60 L56 70 L76 48" fill="none" stroke="#00e5a0"
                stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" />
        </svg>
        <div class="init-text">加载中<span class="init-dots"><i></i><i></i><i></i></span></div>
      </div>
    </div>
  </body>
</html>
